# Copie este arquivo para config.yaml e ajuste com seus dados.

search:
  keywords:
    - "data scien"        # casa "data scientist"/"data science"/"cientista de dados"
    - "data engineer"
    - "epidemiolog"       # casa com "epidemiologia"/"epidemiologist"
    - "biostatistic"
    - "public health"
    - "analytics"
    - "machine learning"
  # A busca casa a keyword só no TÍTULO da vaga (não na descrição inteira),
  # para evitar falsos positivos (ex: uma vaga de vendas que só menciona
  # "analytics" de passagem no corpo do texto).
  locations:
    - "Remote"
    - "Brazil"
    - "Brasil"          # a API de algumas empresas BR retorna "Brasil", não "Brazil"
    - "Rio de Janeiro"
    - "United States"   # ajuste/remova conforme sua disposição a trabalhar para empresas dos EUA
  exclude_keywords:
    - "senior staff"
    - "principal"
  max_results_per_company: 20

# Empresas a monitorar. Descubra o "token"/"slug" de cada uma na URL da
# página de vagas hospedada (ex: https://boards.greenhouse.io/<token>
# ou https://jobs.lever.co/<token>).
#
# NOTA: Greenhouse/Lever são fortes em vagas de tecnologia/dados, mas
# organismos como OPAS/OMS, ONU e a própria Fiocruz normalmente NÃO usam
# esses ATS — eles publicam vagas em portais próprios (ex: careers.who.int,
# paho.org/jobs, concursos Fiocruz). Para essas vagas, o "search"/"run"
# automatizado deste projeto não alcança; é preciso buscar e aplicar
# manualmente, mas ainda dá pra usar `tailor_application()` para gerar o
# currículo/carta adaptados a partir da descrição da vaga colada manualmente.
companies:
  greenhouse:
    - flatironhealth      # Flatiron Health (dados oncológicos/saúde, EUA)
    - truveta              # Truveta (dados de saúde + IA/ML, EUA)
    - komodohealth          # Komodo Health (analytics em saúde, EUA)
    - honor                 # Honor (cuidado domiciliar, EUA, tem vaga remota)
    - carrotfertility       # Carrot Fertility (benefícios de saúde reprodutiva, EUA remoto)
    - quintoandar            # QuintoAndar (proptech BR, vagas de Data Scientist/Engineer remoto no Brasil)
    - cortex                 # Cortex Intelligence (dados/analytics BR, remoto)
    - kunumi                 # Kunumi (IA BR, remoto no Brasil)
  lever:
    - includedhealth        # Included Health (analytics em saúde, EUA)
    - ro                    # Ro (telessaúde, EUA)

candidate:
  full_name: "Antonio Alves Pereira Júnior"
  email: "aapereirajunior@gmail.com"
  phone: "(21) 99427-1238"
  linkedin_url: "https://linkedin.com/in/biomedicoantonio"
  resume_path: "data/resume_base.yaml"
  resume_file_to_upload: "data/resume_base.docx"

application:
  # Modo de envio: "auto" envia direto, "review" só prepara e aguarda aprovação
  mode: "auto"
  dry_run: true          # enquanto true, preenche o formulário mas NÃO clica em enviar
  max_applications_per_run: 10
  cover_letter: true
  default_answers:
    # Respostas padrão para perguntas de triagem comuns (case-insensitive, match parcial)
    "authorized to work": "Yes"
    "require sponsorship": "No"
    "years of experience": "3"
