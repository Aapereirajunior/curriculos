experience:
  - company: "INCQS/Fiocruz — Controle de Qualidade"
    role: "Analista de Controle da Qualidade em Saúde (Setor de Soros Antipeçonhentos e Vacinas Bacterianas)"
    start: "2021-02"
    end: "presente"
    bullets:
      - "Operação do sistema de gestão da qualidade laboratorial sob ABNT NBR ISO/IEC 17025, assegurando rastreabilidade e conformidade documental dos ensaios de controle de imunobiológicos fornecidos ao PNI/SUS."
      - "Autoria e controle de 18 Procedimentos Operacionais Padrão (POP) institucionais, cobrindo fluxo de amostras, ensaios de potência (ELISA, ToBi, in vivo), calibração/qualificação de equipamentos e guarda de padrões de referência."
      - "Gestão e guarda dos padrões de referência nacional (venenos botrópico e crotálico), assegurando condições de armazenamento, identidade e rastreabilidade das amostras."
      - "Validação de métodos analíticos e implementação de métodos alternativos in vitro (princípios 3Rs) para ensaios de potência de soros e vacinas, com redução do tempo de ensaio e ganho de robustez — publicado em Toxicon e Biologicals (2025)."
      - "Coordenação e participação em estudo colaborativo latino-americano (PANAFTOSA/OPAS, 7 países) de neutralização cruzada de soros antipeçonhentos, incluindo avaliação in loco em instituições como o Instituto Butantan."
      - "Investigação de eventos adversos pós-vacinais e articulação técnica com produtores nacionais e internacionais de imunobiológicos."
      - "Criador do sistema \"BioPotency\": aplicação web full-stack em R/Shiny para automação de análises de probitos, traduzindo metodologias analíticas complexas em dashboards e relatórios que aceleram o controle de qualidade."

