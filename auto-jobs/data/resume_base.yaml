full_name: "Antonio Alves Pereira Júnior"
title: "Biomédico | Cientista de Dados | Doutorando em Epidemiologia em Saúde Pública"
summary: >
  Biomédico e Mestre em Ciências Farmacêuticas, doutorando em Epidemiologia em
  Saúde Pública (ENSP/Fiocruz) e especialista em formação em Informática em
  Saúde (UNIFESP). Atua desde 2021 no INCQS/Fiocruz no controle de qualidade
  de imunobiológicos (vacinas e soros hiperimunes) sob ISO/IEC 17025,
  combinando rigor regulatório com ciência de dados aplicada — incluindo o
  desenvolvimento ponta a ponta de sistemas próprios em R/Shiny para
  automação de análises laboratoriais. Também atua em docência e preceptoria
  em saúde pública e bioestatística, e possui produção científica de mais de
  60 itens, incluindo artigos em periódicos internacionais.

